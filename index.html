<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordenar lista de nombre</title>
  </head>
  <body>
    <section class="container">
      <h1>Order Arrays de Cadenas</h1>
      <hr />
      <span
        >Ingresa nombres en la caja de texto de abajo y ordene este listado el
        cual apareceran en el area de texto</span
      >
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" />
        <button id="agregarNombreBtn">Agregar y ordenar nombre</button>
      </div>

      <h2>Nombres ordenados</h2>
      <hr />
      <div>
        <textarea
          id="names-sorted"
          placeholder="Aqui apareceran los nombres organizados"
        ></textarea>
        <button id="limpiarBtn">Limpiar</button>
      </div>
    </section>
  </body>
</html>
